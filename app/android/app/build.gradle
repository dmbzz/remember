plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def ciSigning = System.getenv("REMEMBER_CI_SIGNING") == "true"
def ciSigningKeys = ["REMEMBER_ANDROID_KEYSTORE_PATH", "REMEMBER_ANDROID_STORE_PASSWORD", "REMEMBER_ANDROID_KEY_ALIAS", "REMEMBER_ANDROID_KEY_PASSWORD"]
if (ciSigning && ciSigningKeys.any { !System.getenv(it) }) {
    throw new GradleException("CI signing requires all REMEMBER_ANDROID signing environment variables")
}

android {
    signingConfigs {
        if (ciSigning) {
            ciRelease {
                storeFile file(System.getenv("REMEMBER_ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("REMEMBER_ANDROID_STORE_PASSWORD")
                keyAlias System.getenv("REMEMBER_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("REMEMBER_ANDROID_KEY_PASSWORD")
            }
        }
    }
    namespace = "com.classnotes.assistant"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "com.classnotes.assistant"
        minSdk = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/public'
            systemProperty 'widget.output', file('../../../native-previews').absolutePath
        }
    }

    buildTypes {
        release {
            signingConfig = ciSigning ? signingConfigs.ciRelease : signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
