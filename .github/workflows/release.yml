name: Build and release Remember
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'test builds only; publish creates a verified release'
        required: true
        type: choice
        options: [test, publish, recover]
        default: test
      recover_run_id:
        description: 'For recover: original Actions run ID'
        required: false
        type: string
      recover_version:
        description: 'For recover: original version, e.g. 1.2.3'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: remember-release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          architecture: x64
      - id: gate
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: python scripts/release_gate.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.gate.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        if: steps.gate.outputs.run == 'true'
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Prepare Android signing
        if: steps.gate.outputs.run == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.REMEMBER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.REMEMBER_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.REMEMBER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.REMEMBER_ANDROID_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:KEYSTORE_BASE64 -or -not $env:STORE_PASSWORD -or -not $env:KEY_ALIAS -or -not $env:KEY_PASSWORD) { throw 'Missing Android signing secrets' }
          $path = Join-Path $env:RUNNER_TEMP 'remember-signing.jks'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "REMEMBER_ANDROID_KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build Android
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        env:
          REMEMBER_CI_SIGNING: 'true'
          REMEMBER_ANDROID_STORE_PASSWORD: ${{ secrets.REMEMBER_ANDROID_STORE_PASSWORD }}
          REMEMBER_ANDROID_KEY_ALIAS: ${{ secrets.REMEMBER_ANDROID_KEY_ALIAS }}
          REMEMBER_ANDROID_KEY_PASSWORD: ${{ secrets.REMEMBER_ANDROID_KEY_PASSWORD }}
        shell: pwsh
        run: |
          flutter pub get
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          flutter build apk --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify APK identity and signing certificate
        if: steps.gate.outputs.run == 'true'
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
          RELEASE_CODE: ${{ steps.gate.outputs.code }}
        shell: pwsh
        run: |
          # This version's v2 and v3.2 output was verified on the runner.
          $buildToolsPath = Join-Path $env:ANDROID_HOME 'build-tools\37.0.0'
          if (-not (Test-Path -LiteralPath (Join-Path $buildToolsPath 'apksigner.bat')) -or -not (Test-Path -LiteralPath (Join-Path $buildToolsPath 'aapt.exe'))) { throw 'Validated Android build-tools 37.0.0 missing' }
          $buildTools = Get-Item -LiteralPath $buildToolsPath
          Write-Host "Android build-tools: $($buildTools.Name)"
          $apk = 'app/build/app/outputs/flutter-apk/app-release.apk'
          $badging = & "$($buildTools.FullName)\aapt.exe" dump badging $apk
          if ($LASTEXITCODE -ne 0 -or ($badging -join "`n") -notmatch "package: name='com\.classnotes\.assistant'") { throw 'Unexpected APK package' }
          if (($badging -join "`n") -notmatch ("versionCode='" + [regex]::Escape($env:RELEASE_CODE) + "'") -or ($badging -join "`n") -notmatch ("versionName='" + [regex]::Escape($env:RELEASE_VERSION) + "'")) { throw 'Unexpected APK version' }
          $cert = & "$($buildTools.FullName)\apksigner.bat" verify --verbose --print-certs $apk
          $verifyExitCode = $LASTEXITCODE
          # Print only public verification metadata, never certificate subjects.
          foreach ($line in $cert) {
            if ($line -match '^(Verified using v[0-9.]+ scheme \(.*\): (true|false)|Number of signers: [0-9]+)$') { Write-Host $line }
            elseif ($line -match '^(Signer #[0-9]+|V[0-9.]+ Signer:|Signer \(minSdkVersion=[0-9]+, maxSdkVersion=[0-9]+\)) certificate SHA-256 digest: [0-9a-fA-F]{64}$') { Write-Host $line }
            elseif ($line -match 'certificate SHA-256 digest:') { Write-Host 'Unrecognized certificate SHA-256 line format' }
          }
          if ($verifyExitCode -ne 0) { throw 'APK signature verification failed' }
          $counts = @($cert | Where-Object { $_ -match '^Number of signers:' })
          if ($counts.Count -ne 1 -or $counts[0] -cne 'Number of signers: 1') { throw 'Unexpected number of APK signers' }
          $schemes = @{}
          foreach ($line in @($cert | Where-Object { $_ -match '^Verified using' })) {
            if ($line -cnotmatch '^Verified using v([0-9.]+) scheme \([^)]*\): (true|false)$') { throw 'Unrecognized APK verification scheme output' }
            $version = $Matches[1]
            if ($schemes.ContainsKey($version)) { throw 'Duplicate APK verification scheme output' }
            $schemes[$version] = $Matches[2]
          }
          foreach ($version in @('1', '2', '3', '3.1', '3.2', '4')) {
            if (-not $schemes.ContainsKey($version)) { throw 'Missing APK verification scheme output' }
          }
          foreach ($version in $schemes.Keys) {
            if (($version -eq '2' -and $schemes[$version] -cne 'true') -or ($version -ne '2' -and $schemes[$version] -cne 'false')) { throw 'Unexpected APK signing scheme' }
          }
          $signers = @($cert | Where-Object { $_ -match 'certificate SHA-256 digest' })
          if ($signers.Count -ne 1 -or $signers[0] -cnotmatch '^V2 Signer: certificate SHA-256 digest: ([0-9a-fA-F]{64})$') { throw 'Unexpected APK certificate output' }
          $actualFingerprint = $Matches[1].ToLowerInvariant()
          Write-Host "Public APK signing certificate SHA-256: $actualFingerprint"
          if ($actualFingerprint -ne 'c467b719bd954fe653374bfa3248ea603ad4bcd930fdbbc420345066f9bcf55a') { throw 'APK signing certificate does not match existing installation' }
      - name: Build Windows
        if: steps.gate.outputs.run == 'true'
        working-directory: app
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare embedded Python and package
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          $runtimeZip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.13.14/python-3.13.14-embed-amd64.zip' -OutFile $runtimeZip
          if ((Get-FileHash -Algorithm SHA256 $runtimeZip).Hash.ToLowerInvariant() -ne '90b4e5b9898b72d744650524bff92377c367f44bd5fbd09e3148656c080ad907') { throw 'Python runtime hash mismatch' }
          $runtime = Join-Path $env:RUNNER_TEMP 'remember-python'
          Expand-Archive -LiteralPath $runtimeZip -DestinationPath $runtime
          python -m pip install --disable-pip-version-check --target "$runtime/Lib/site-packages" -r server/requirements-portable.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -Type Directory -Force dist | Out-Null
          Copy-Item app/build/app/outputs/flutter-apk/app-release.apk "dist/Remember-$env:RELEASE_VERSION-Android.apk"
          python scripts/package_github_release.py --repo . --windows-release app/build/windows/x64/runner/Release --python-runtime $runtime --apk "dist/Remember-$env:RELEASE_VERSION-Android.apk" --output-dir dist --version $env:RELEASE_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test portable backend
        if: steps.gate.outputs.run == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.gate.outputs.version }}
        run: |
          $test = Join-Path $env:RUNNER_TEMP 'remember-smoke'
          Expand-Archive -LiteralPath "dist/Remember-$env:RELEASE_VERSION-Windows-完整包.zip" -DestinationPath $test
          $root = Join-Path $test 'Remember'
          if (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue) { throw 'Port 8000 occupied before smoke test' }
          $proc = Start-Process -FilePath (Join-Path $root 'app.exe') -WorkingDirectory $root -PassThru
          $backendPid = $null
          try {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8000/api/health' -TimeoutSec 2
                $listener = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction Stop | Select-Object -First 1
                $backend = Get-Process -Id $listener.OwningProcess -ErrorAction Stop
                $expected = [IO.Path]::GetFullPath((Join-Path $root 'backend\runtime\python.exe'))
                if ($health.code -eq 0 -and $health.data.app -eq 'class_notes_assistant' -and $health.data.version -eq $env:RELEASE_VERSION -and $backend.Path -eq $expected) { $backendPid = $backend.Id; $ok = $true; break }
              } catch {}
            }
            if (-not $ok -or $proc.HasExited) { throw 'Portable application/backend smoke test failed' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            if ($backendPid) { Stop-Process -Id $backendPid -Force -ErrorAction SilentlyContinue }
          }
          $sourcePrompt = Get-FileHash -Algorithm SHA256 'server/config/prompts/note_fused.md'
          $packedPrompt = Get-FileHash -Algorithm SHA256 (Join-Path $root 'backend/server/config/prompts/note_fused.md')
          if ($sourcePrompt.Hash -ne $packedPrompt.Hash) { throw 'Built-in note template differs from source' }
          $python = Join-Path $root 'backend/runtime/python.exe'
          & $python -c "from app.services.note_generation_service import NoteGenerationService, PROMPT_FILE; s=NoteGenerationService.__new__(NoteGenerationService); assert s._load_prompt_template()==PROMPT_FILE.read_text(encoding='utf-8')"
          if ($LASTEXITCODE) { throw 'Packaged service failed to load its note template' }
      - name: Save test artifacts
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Remember-${{ steps.gate.outputs.version }}
          path: |
            dist/*.apk
            dist/*.zip
          if-no-files-found: error
      - name: Remove temporary signing file
        if: always()
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'remember-signing.jks'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Remember-${{ needs.build.outputs.version }}
          path: dist
      - run: python -m pip install requests==2.32.5
      - name: Publish exact verified build artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: pwsh
        run: |
          python scripts/publish_github_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  recover:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recover'
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.recover_run_id }}
          RECOVERY_VERSION: ${{ inputs.recover_version }}
        run: python scripts/recover_release.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Remember-${{ steps.source.outputs.version }}
          path: dist
          run-id: ${{ inputs.recover_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install requests==2.32.5
      - name: Resume with original build bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
          RECOVER_DRAFT_ONLY: 'true'
        shell: pwsh
        run: |
          python scripts/publish_github_release.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
